name: CI

# Valida cada PR (y push) hacia las ramas de larga vida.
# Flujo: feature/* -> develop -> staging -> main
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

# Cancela runs viejos del mismo PR/rama cuando llega uno nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # El conftest usa SQLite y overridea get_db; estos valores solo
      # satisfacen la config al importar la app (no se conecta a una DB real).
      TESTING: "1"
      # Valor dummy solo para CI: debe tener >=32 chars para pasar el fail-fast de config.py
      SECRET_KEY: dummy-ci-secret-not-used-in-production-0123456789
      DATABASE_URL: sqlite:///./test.db
      DEBUG: "False"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      ANTHROPIC_API_KEY: dummy-ci-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  frontend-build:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # El build no necesita valores reales; solo que existan las vars públicas.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-ci-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check incluido)
        run: npm run build

  pr-title:
    name: PR · Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validar título del PR
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tipos permitidos (Conventional Commits).
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            style
            revert
